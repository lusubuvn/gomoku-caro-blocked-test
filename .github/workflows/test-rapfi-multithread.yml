name: Test Rapfi Single and Multi WASM

on:
  push:
    branches:
      - feature/engine-settings
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Configure single-thread engine
        run: |
          emcmake cmake -S Rapfi -B Rapfi/build-wasm-single-test \
            -DCMAKE_BUILD_TYPE=Release \
            -DNO_MULTI_THREADING=ON \
            -DNO_COMMAND_MODULES=ON \
            -DUSE_WASM_SIMD=ON \
            -DUSE_WASM_SIMD_RELAXED=OFF \
            -DUSE_NEON=OFF \
            -DENABLE_LTO=OFF

      - name: Build single-thread engine
        run: |
          cmake --build Rapfi/build-wasm-single-test --target rapfi --parallel 2
          test -s Rapfi/build-wasm-single-test/rapfi-single-simd128.js
          test -s Rapfi/build-wasm-single-test/rapfi-single-simd128.wasm
          test -s Rapfi/build-wasm-single-test/rapfi-single-simd128.data

      - name: Configure multi-thread engine
        run: |
          emcmake cmake -S Rapfi -B Rapfi/build-wasm-multi-test \
            -DCMAKE_BUILD_TYPE=Release \
            -DNO_MULTI_THREADING=OFF \
            -DNO_COMMAND_MODULES=ON \
            -DUSE_WASM_SIMD=ON \
            -DUSE_WASM_SIMD_RELAXED=OFF \
            -DUSE_NEON=OFF \
            -DENABLE_LTO=OFF

      - name: Build multi-thread engine
        run: |
          cmake --build Rapfi/build-wasm-multi-test --target rapfi --parallel 2
          test -s Rapfi/build-wasm-multi-test/rapfi-multi-simd128.js
          test -s Rapfi/build-wasm-multi-test/rapfi-multi-simd128.wasm
          test -s Rapfi/build-wasm-multi-test/rapfi-multi-simd128.data

      - name: Check engine files
        run: |
          ls -lh Rapfi/build-wasm-single-test/rapfi-single-simd128.*
          ls -lh Rapfi/build-wasm-multi-test/rapfi-multi-simd128.*

          SINGLE_DATA=$(stat -c%s Rapfi/build-wasm-single-test/rapfi-single-simd128.data)
          MULTI_DATA=$(stat -c%s Rapfi/build-wasm-multi-test/rapfi-multi-simd128.data)

          echo "Single data: ${SINGLE_DATA} bytes"
          echo "Multi data: ${MULTI_DATA} bytes"

          test "$SINGLE_DATA" -gt 1000000
          test "$MULTI_DATA" -gt 1000000

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Gomocalc/package-lock.json

      - name: Install website dependencies
        working-directory: Gomocalc
        run: npm ci

      - name: Copy single and multi WASM into website
        run: |
          mkdir -p Gomocalc/public/build

          cp Rapfi/build-wasm-single-test/rapfi-single-simd128.js Gomocalc/public/build/rapfi-single-simd128.js
          cp Rapfi/build-wasm-single-test/rapfi-single-simd128.wasm Gomocalc/public/build/rapfi-single-simd128.wasm

          cp Rapfi/build-wasm-multi-test/rapfi-multi-simd128.js Gomocalc/public/build/rapfi-multi-simd128.js
          cp Rapfi/build-wasm-multi-test/rapfi-multi-simd128.wasm Gomocalc/public/build/rapfi-multi-simd128.wasm

      - name: Split NNUE packages into Pages-safe files
        run: |
          set -e
          rm -f Gomocalc/public/build/rapfi-single-data.part* Gomocalc/public/build/rapfi-multi-data.part*

          split -b 20m -d -a 3 Rapfi/build-wasm-single-test/rapfi-single-simd128.data Gomocalc/public/build/rapfi-single-data.part
          split -b 20m -d -a 3 Rapfi/build-wasm-multi-test/rapfi-multi-simd128.data Gomocalc/public/build/rapfi-multi-data.part

          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const dir = 'Gomocalc/public/build'

          for (const kind of ['single', 'multi']) {
            const prefix = `rapfi-${kind}-data.part`
            const parts = fs.readdirSync(dir).filter(name => name.startsWith(prefix)).sort()

            if (!parts.length) throw new Error(`No NNUE chunks found for ${kind}`)

            const size = parts.reduce(
              (sum, name) => sum + fs.statSync(path.join(dir, name)).size, 0
            )

            for (const name of parts) {
              const partSize = fs.statSync(path.join(dir, name)).size
              if (partSize > 25 * 1024 * 1024) {
                throw new Error(`${name} exceeds Cloudflare Pages 25 MiB limit`)
              }
            }

            fs.writeFileSync(
              path.join(dir, `rapfi-${kind}-data-manifest.json`),
              JSON.stringify({ size, parts })
            )

            console.log(`${kind} NNUE: ${size} bytes, ${parts.length} chunks`)
          }
          NODE

      - name: Build website with single and multi WASM
        working-directory: Gomocalc
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          VUE_APP_PUBLIC_PATH: /
        run: npm run build

      - name: Verify website output
        run: |
          set -e

          test -s Gomocalc/dist/build/rapfi-single-simd128.js
          test -s Gomocalc/dist/build/rapfi-single-simd128.wasm
          test -s Gomocalc/dist/build/rapfi-single-data-manifest.json
          test -s Gomocalc/dist/build/rapfi-multi-data-manifest.json

          test -s Gomocalc/dist/build/rapfi-multi-simd128.js
          test -s Gomocalc/dist/build/rapfi-multi-simd128.wasm

          test -n "$(find Gomocalc/dist/build -maxdepth 1 -name 'rapfi-single-data.part*' -print -quit)"
          test -n "$(find Gomocalc/dist/build -maxdepth 1 -name 'rapfi-multi-data.part*' -print -quit)"

          echo "===== WEBSITE ENGINE FILES ====="
          ls -lh Gomocalc/dist/build/rapfi-*
          ls -lh Gomocalc/dist/build/rapfi-*-data*
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy Gomocalc/dist --project-name=gomoku-caro-blocked-test --branch=feature/engine-settings
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload website test artifact
        uses: actions/upload-artifact@v4
        with:
          name: gomocalc-website-single-and-multi
          path: Gomocalc/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload test engines
        uses: actions/upload-artifact@v4
        with:
          name: rapfi-wasm-single-and-multi
          path: |
            Rapfi/build-wasm-single-test/rapfi-single-simd128.js
            Rapfi/build-wasm-single-test/rapfi-single-simd128.wasm
            Rapfi/build-wasm-single-test/rapfi-single-simd128.data
            Rapfi/build-wasm-multi-test/rapfi-multi-simd128.js
            Rapfi/build-wasm-multi-test/rapfi-multi-simd128.wasm
            Rapfi/build-wasm-multi-test/rapfi-multi-simd128.data
